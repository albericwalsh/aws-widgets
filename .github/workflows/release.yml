name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit built `dist/` and update tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # We're in a detached HEAD at the tag commit; create a new commit containing dist
          git checkout --detach
          git add -f dist
          if git diff --staged --quiet; then
            echo "No changes to commit for dist"
          else
            git commit -m "chore(release): include built dist for ${GITHUB_REF_NAME}"
          fi
          # Force-update the tag to point at the new commit (or leave as-is if no new commit)
          git tag -f ${GITHUB_REF_NAME}
          git push origin refs/tags/${GITHUB_REF_NAME} --force

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload ES bundle
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/aws-widgets.es.js
          asset_name: aws-widgets.es.js
          asset_content_type: application/javascript
      - name: Upload CJS bundle
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/aws-widgets.cjs.js
          asset_name: aws-widgets.cjs.js
          asset_content_type: application/javascript
      - name: Publish to npm (optional)
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          npm publish --access public
